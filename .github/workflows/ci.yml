name: CI - Desa Digital

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  uat:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: desa_user
          POSTGRES_PASSWORD: desa_pass
          POSTGRES_DB: desa_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U desa_user -d desa_db"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      NODE_ENV: development
      DATABASE_URL: postgres://desa_user:desa_pass@localhost:5432/desa_db
      APP_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (tsc)
        run: npm run lint

      - name: Unit & integration tests
        run: npm test

      - name: Start dev server
        run: |
          npm run dev > /tmp/dev.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health >/dev/null; then
              echo "server ready"; break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:3000/api/health

      - name: Seed dummy data
        run: node scripts/seed-dummy.mjs

      - name: Smoke test
        run: npm run smoke

      - name: Security regression
        run: npm run security

      - name: Full UAT simulation
        run: npm run uat:full

      - name: Build
        run: npm run build

      - name: Stop server
        if: always()
        run: pkill -f "tsx server.ts" || true

      - name: Upload dev log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dev-log
          path: /tmp/dev.log